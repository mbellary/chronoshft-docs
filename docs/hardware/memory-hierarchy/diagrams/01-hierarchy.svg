<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
<title id="title">A hierarchy of capacity and access cost</title><desc id="desc">Registers, L1, L2, last-level cache and RAM; persistent storage shown across an operating-system boundary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007c78"/></marker></defs>
<rect width="920" height="560" rx="16" fill="#f7fafb"/>
<g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="21" fill="#183347" text-anchor="start" font-weight="700">A hierarchy of capacity and access cost</text><rect x="355.0" y="64" width="210" height="58" rx="10" fill="#d5f0e9" stroke="#bdcfd8"/><text x="460.0" y="90.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Registers</text><text x="460.0" y="115.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Compiler-selected operands</text><rect x="305.0" y="133" width="310" height="58" rx="10" fill="#e1f1ef" stroke="#bdcfd8"/><text x="460.0" y="159.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">L1 cache</text><text x="460.0" y="184.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Small • close to the core</text><rect x="255.0" y="202" width="410" height="58" rx="10" fill="#e9f1fa" stroke="#bdcfd8"/><text x="460.0" y="228.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">L2 cache</text><text x="460.0" y="253.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">More space</text><rect x="205.0" y="271" width="510" height="58" rx="10" fill="#edf0fb" stroke="#bdcfd8"/><text x="460.0" y="297.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Last-level cache</text><text x="460.0" y="322.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Often shared across cores</text><rect x="155.0" y="340" width="610" height="58" rx="10" fill="#eef1f4" stroke="#bdcfd8"/><text x="460.0" y="366.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">RAM / DRAM</text><text x="460.0" y="391.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Large active memory</text><text x="34" y="105" font-size="15" fill="#183347" text-anchor="start" font-weight="400">Usually smaller</text><text x="34" y="128" font-size="15" fill="#183347" text-anchor="start" font-weight="400">and faster</text><path d="M122,330 L122,155" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><text x="735" y="280" font-size="15" fill="#183347" text-anchor="start" font-weight="400">Usually larger</text><text x="735" y="303" font-size="15" fill="#183347" text-anchor="start" font-weight="400">and slower</text><path d="M800,110 L800,245" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M100,423 H820" stroke="#9baeb8" stroke-dasharray="6 5"/><rect x="155" y="443" width="610" height="63" rx="10" fill="#fff0df" stroke="#bdcfd8"/><text x="460.0" y="471.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Persistent storage: SSD / HDD</text><text x="460.0" y="496.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Accessed through OS I/O or fault handling</text><text x="460" y="536" font-size="16" fill="#a54b16" text-anchor="middle" font-weight="400">A CPU cache miss does not automatically become storage I/O.</text></g></svg>