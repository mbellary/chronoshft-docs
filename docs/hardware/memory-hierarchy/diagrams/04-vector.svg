<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc">
<title id="title">One vector, two distinct pieces</title><desc id="desc">A vector descriptor points to a contiguous heap buffer, with four initialized elements and capacity for six.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007c78"/></marker></defs>
<rect width="920" height="330" rx="16" fill="#f7fafb"/>
<g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="21" fill="#183347" text-anchor="start" font-weight="700">One vector, two distinct pieces</text><rect x="30" y="96" width="275" height="105" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="167.5" y="145.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Vec descriptor</text><text x="167.5" y="170.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">pointer • length • capacity</text><text x="167" y="233" font-size="13" fill="#183347" text-anchor="middle" font-weight="400">Conceptual fields; order unspecified</text><path d="M315,146 L397,146" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="413" y="103" width="73" height="85" rx="10" fill="#e2f3ec" stroke="#bdcfd8"/><text x="449.5" y="151.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">10</text><rect x="491" y="103" width="73" height="85" rx="10" fill="#e2f3ec" stroke="#bdcfd8"/><text x="527.5" y="151.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">20</text><rect x="569" y="103" width="73" height="85" rx="10" fill="#e2f3ec" stroke="#bdcfd8"/><text x="605.5" y="151.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">30</text><rect x="647" y="103" width="73" height="85" rx="10" fill="#e2f3ec" stroke="#bdcfd8"/><text x="683.5" y="151.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">40</text><rect x="725" y="103" width="73" height="85" rx="10" fill="#eef0f2" stroke="#bdcfd8"/><text x="761.5" y="151.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">spare</text><rect x="803" y="103" width="73" height="85" rx="10" fill="#eef0f2" stroke="#bdcfd8"/><text x="839.5" y="151.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">spare</text><text x="565" y="224" font-size="16" fill="#007c78" text-anchor="middle" font-weight="400">length = 4 initialized elements</text><text x="647" y="254" font-size="16" fill="#183347" text-anchor="middle" font-weight="400">capacity = space for 6 elements</text><text x="460" y="301" font-size="16" fill="#183347" text-anchor="middle" font-weight="400">Heap buffer: consecutive element slots, separate from the descriptor.</text></g></svg>