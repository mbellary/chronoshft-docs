<svg xmlns="http://www.w3.org/2000/svg" width="920" height="530" viewBox="0 0 920 530" role="img" aria-labelledby="title desc">
<title id="title">Address translation and data retrieval</title><desc id="desc">The TLB caches mappings. A miss can lead to a page-table walk. Mapping or permissions issues can trigger OS fault handling; storage I/O is conditional.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007c78"/></marker></defs>
<rect width="920" height="530" rx="16" fill="#f7fafb"/>
<g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="21" fill="#183347" text-anchor="start" font-weight="700">Address translation and data retrieval</text><rect x="30" y="94" width="190" height="82" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="125.0" y="132.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Virtual address</text><text x="125.0" y="157.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Program-visible location</text><path d="M225,134 L276,134" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="285" y="94" width="230" height="82" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="400.0" y="132.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">TLB / translation</text><text x="400.0" y="157.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Where is this mapped?</text><path d="M520,134 L576,134" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="585" y="94" width="300" height="82" rx="10" fill="#e4edf9" stroke="#bdcfd8"/><text x="735.0" y="132.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Cache hierarchy → RAM</text><text x="735.0" y="157.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Where are the data bytes?</text><path d="M400,185 L400,228" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="275" y="236" width="250" height="72" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="400.0" y="269.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Page-table walk</text><text x="400.0" y="294.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Translation not in TLB</text><text x="30" y="357" font-size="16" fill="#183347" text-anchor="start" font-weight="400">If the mapping or access needs OS handling:</text><rect x="30" y="382" width="330" height="80" rx="10" fill="#fff0df" stroke="#bdcfd8"/><text x="195.0" y="419.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Page fault → operating system</text><text x="195.0" y="444.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Allocate / map / copy / reject</text><path d="M369,422 L455,422" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="465" y="382" width="420" height="80" rx="10" fill="#fff0df" stroke="#bdcfd8"/><text x="675.0" y="419.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Storage I/O only when required</text><text x="675.0" y="444.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Many faults do not require device access</text><text x="460" y="502" font-size="18" fill="#007c78" text-anchor="middle" font-weight="600">TLB miss ≠ cache miss ≠ page fault.</text></g></svg>