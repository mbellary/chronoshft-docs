<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">False sharing: different variables, one cache line</title><desc id="desc">Two cores writing separate counters in one line can contend. Spacing and reducing shared writes can help.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007c78"/></marker></defs>
<rect width="920" height="520" rx="16" fill="#f7fafb"/>
<g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="21" fill="#183347" text-anchor="start" font-weight="700">False sharing: different variables, one cache line</text><text x="28" y="84" font-size="17" fill="#183347" text-anchor="start" font-weight="400">Two threads modify different counters:</text><rect x="40" y="111" width="205" height="65" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="142.5" y="149.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Core A → counter A</text><rect x="675" y="111" width="205" height="65" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="777.5" y="149.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">Core B → counter B</text><path d="M225,183 L330,228" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M695,183 L590,228" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="260" y="237" width="400" height="70" rx="10" fill="#fff0df" stroke="#bdcfd8"/><text x="460.0" y="269.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">[ counter A | counter B ]</text><text x="460.0" y="294.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">One cache line: coherence can contend</text><text x="460" y="348" font-size="18" fill="#007c78" text-anchor="middle" font-weight="600">Possible remedy: independent aligned storage</text><rect x="60" y="376" width="340" height="77" rx="10" fill="#ddf1eb" stroke="#bdcfd8"/><text x="230.0" y="411.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">[ counter A | padding ]</text><text x="230.0" y="436.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Line A</text><rect x="520" y="376" width="340" height="77" rx="10" fill="#ddf1eb" stroke="#bdcfd8"/><text x="690.0" y="411.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">[ counter B | padding ]</text><text x="690.0" y="436.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">Line B</text><text x="460" y="492" font-size="17" fill="#183347" text-anchor="middle" font-weight="400">Also reduce shared writes: accumulate locally, publish once.</text></g></svg>