<g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="21" fill="#183347" text-anchor="start" font-weight="700">Access patterns tell different stories</text><text x="28" y="94" font-size="18" fill="#007c78" text-anchor="start" font-weight="600">Spatial locality</text><text x="28" y="121" font-size="14" fill="#183347" text-anchor="start" font-weight="400">Nearby addresses, in sequence</text><rect x="405" y="64" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="434.0" y="96.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">0</text><path d="M465,90 L481,90" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="484" y="64" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="513.0" y="96.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">1</text><path d="M544,90 L560,90" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="563" y="64" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="592.0" y="96.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">2</text><path d="M623,90 L639,90" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="642" y="64" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="671.0" y="96.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">3</text><path d="M702,90 L718,90" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="721" y="64" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="750.0" y="96.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">4</text><path d="M781,90 L797,90" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="64" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="829.0" y="96.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">5</text><text x="28" y="200" font-size="18" fill="#007c78" text-anchor="start" font-weight="600">Temporal locality</text><text x="28" y="227" font-size="14" fill="#183347" text-anchor="start" font-weight="400">Reuse the same address soon</text><rect x="405" y="170" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="434.0" y="202.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">2</text><path d="M465,196 L481,196" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="484" y="170" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="513.0" y="202.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">2</text><path d="M544,196 L560,196" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="563" y="170" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="592.0" y="202.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">2</text><path d="M623,196 L639,196" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="642" y="170" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="671.0" y="202.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">2</text><path d="M702,196 L718,196" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="721" y="170" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="750.0" y="202.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">2</text><path d="M781,196 L797,196" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="170" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="829.0" y="202.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">2</text><text x="28" y="306" font-size="18" fill="#007c78" text-anchor="start" font-weight="600">Dependent jumps</text><text x="28" y="333" font-size="14" fill="#183347" text-anchor="start" font-weight="400">Read a value to discover the next address</text><rect x="405" y="276" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="434.0" y="308.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">0</text><path d="M465,302 L481,302" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="484" y="276" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="513.0" y="308.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">7</text><path d="M544,302 L560,302" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="563" y="276" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="592.0" y="308.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">3</text><path d="M623,302 L639,302" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="642" y="276" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="671.0" y="308.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">9</text><path d="M702,302 L718,302" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="721" y="276" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="750.0" y="308.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">2</text><path d="M781,302 L797,302" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="800" y="276" width="58" height="52" rx="10" fill="#e3eef8" stroke="#bdcfd8"/><text x="829.0" y="308.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">5</text></g></svg>