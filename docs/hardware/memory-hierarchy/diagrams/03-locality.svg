<svg xmlns="http://www.w3.org/2000/svg" width="920" height="365" viewBox="0 0 920 365" role="img" aria-labelledby="title desc">
<title id="title">Access patterns tell different stories</title><desc id="desc">Sequential neighbors demonstrate spatial locality; repeated indices demonstrate temporal locality; scrambled dependent steps require address discovery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007c78"/></marker></defs>
