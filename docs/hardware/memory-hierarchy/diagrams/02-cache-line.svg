<svg xmlns="http://www.w3.org/2000/svg" width="920" height="335" viewBox="0 0 920 335" role="img" aria-labelledby="title desc">
<title id="title">A fetch brings a block of neighboring bytes</title><desc id="desc">Eight eight-byte unsigned integers occupy an assumed aligned 64-byte cache line.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007c78"/></marker></defs>
<rect width="920" height="335" rx="16" fill="#f7fafb"/>
<g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="21" fill="#183347" text-anchor="start" font-weight="700">A fetch brings a block of neighboring bytes</text><text x="28" y="76" font-size="17" fill="#183347" text-anchor="start" font-weight="400">Assume one 64-byte cache line, aligned to its boundary.</text><rect x="45" y="102" width="100" height="71" rx="10" fill="#e8eff9" stroke="#bdcfd8"/><text x="95.0" y="134.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">10</text><text x="95.0" y="159.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">index 0</text><rect x="148" y="102" width="100" height="71" rx="10" fill="#e8eff9" stroke="#bdcfd8"/><text x="198.0" y="134.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">20</text><text x="198.0" y="159.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">index 1</text><rect x="251" y="102" width="100" height="71" rx="10" fill="#cdeee5" stroke="#bdcfd8"/><text x="301.0" y="134.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">30</text><text x="301.0" y="159.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">index 2</text><rect x="354" y="102" width="100" height="71" rx="10" fill="#e8eff9" stroke="#bdcfd8"/><text x="404.0" y="134.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">40</text><text x="404.0" y="159.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">index 3</text><rect x="457" y="102" width="100" height="71" rx="10" fill="#e8eff9" stroke="#bdcfd8"/><text x="507.0" y="134.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">50</text><text x="507.0" y="159.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">index 4</text><rect x="560" y="102" width="100" height="71" rx="10" fill="#e8eff9" stroke="#bdcfd8"/><text x="610.0" y="134.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">60</text><text x="610.0" y="159.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">index 5</text><rect x="663" y="102" width="100" height="71" rx="10" fill="#e8eff9" stroke="#bdcfd8"/><text x="713.0" y="134.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">70</text><text x="713.0" y="159.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">index 6</text><rect x="766" y="102" width="100" height="71" rx="10" fill="#e8eff9" stroke="#bdcfd8"/><text x="816.0" y="134.5" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">80</text><text x="816.0" y="159.5" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">index 7</text><text x="460" y="211" font-size="19" fill="#007c78" text-anchor="middle" font-weight="600">8 values × 8 bytes = 64 bytes</text><path d="M303,281 L303,180" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><text x="460" y="307" font-size="17" fill="#183347" text-anchor="middle" font-weight="400">Request index 2 → the cache line contains neighbors too.</text></g></svg>