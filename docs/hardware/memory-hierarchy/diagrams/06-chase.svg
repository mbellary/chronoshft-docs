<svg xmlns="http://www.w3.org/2000/svg" width="920" height="332" viewBox="0 0 920 332" role="img" aria-labelledby="title desc">
<title id="title">A chain of dependent reads</title><desc id="desc">Index zero leads to seven, then three, five, two and back to zero. Later read addresses depend on earlier results.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#007c78"/></marker></defs>
<rect width="920" height="332" rx="16" fill="#f7fafb"/>
<g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="21" fill="#183347" text-anchor="start" font-weight="700">A chain of dependent reads</text><text x="28" y="83" font-size="17" fill="#183347" text-anchor="start" font-weight="400">Each value tells the program which index to read next.</text><rect x="47" y="124" width="130" height="92" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="112.0" y="167.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">index 0</text><text x="112.0" y="192.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">next = 7</text><path d="M179,170 L215,170" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="219" y="124" width="130" height="92" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="284.0" y="167.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">index 7</text><text x="284.0" y="192.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">next = 3</text><path d="M351,170 L387,170" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="391" y="124" width="130" height="92" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="456.0" y="167.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">index 3</text><text x="456.0" y="192.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">next = 5</text><path d="M523,170 L559,170" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="563" y="124" width="130" height="92" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="628.0" y="167.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">index 5</text><text x="628.0" y="192.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">next = 2</text><path d="M695,170 L731,170" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="735" y="124" width="130" height="92" rx="10" fill="#e8f5f2" stroke="#bdcfd8"/><text x="800.0" y="167.0" font-size="18" fill="#183347" text-anchor="middle" font-weight="600">index 2</text><text x="800.0" y="192.0" font-size="14" fill="#183347" text-anchor="middle" font-weight="400">next = 0</text><path d="M800,220 V263 H112 V220" fill="none" stroke="#007c78" stroke-width="2.5" marker-end="url(#arrow)"/><text x="460" y="303" font-size="16" fill="#183347" text-anchor="middle" font-weight="400">A small example cycle; the lab scrambles every index in its buffer.</text></g></svg>