<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="A wrong prediction discards speculative work"><style>text{font-family:system-ui,sans-serif;fill:#163047}.label{font-size:18px;font-weight:650}.small{font-size:15px}.title{font-size:24px;font-weight:700}</style><defs><marker id="cpu-recovery-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#497084"/></marker></defs><rect width="1000" height="330" rx="16" fill="#f0f6f8"/><text x="30" y="38" class="title">A wrong prediction discards speculative work</text><text x="30" y="65" class="small">Conceptual stages; real processors overlap execution and contain more structures.</text><rect x="30" y="100" width="165" height="75" rx="8" fill="#d9ece9"/><text x="112.5" y="130" text-anchor="middle" class="label">Fetch</text><text x="112.5" y="154" text-anchor="middle" class="small">choose address</text><path d="M198,137 L217,137" stroke="#497084" stroke-width="2" fill="none" marker-end="url(#cpu-recovery-arrow)"/><rect x="223" y="100" width="165" height="75" rx="8" fill="#d9ece9"/><text x="305.5" y="130" text-anchor="middle" class="label">Decode</text><text x="305.5" y="154" text-anchor="middle" class="small">read instructions</text><path d="M391,137 L410,137" stroke="#497084" stroke-width="2" fill="none" marker-end="url(#cpu-recovery-arrow)"/><rect x="416" y="100" width="165" height="75" rx="8" fill="#d9ece9"/><text x="498.5" y="130" text-anchor="middle" class="label">Rename</text><text x="498.5" y="154" text-anchor="middle" class="small">map registers</text><path d="M584,137 L603,137" stroke="#497084" stroke-width="2" fill="none" marker-end="url(#cpu-recovery-arrow)"/><rect x="609" y="100" width="165" height="75" rx="8" fill="#d9ece9"/><text x="691.5" y="130" text-anchor="middle" class="label">Execute</text><text x="691.5" y="154" text-anchor="middle" class="small">resolve branch</text><path d="M777,137 L796,137" stroke="#497084" stroke-width="2" fill="none" marker-end="url(#cpu-recovery-arrow)"/><rect x="802" y="100" width="165" height="75" rx="8" fill="#d9ece9"/><text x="884.5" y="130" text-anchor="middle" class="label">Retire</text><text x="884.5" y="154" text-anchor="middle" class="small">commit results</text><rect x="415" y="204" width="545" height="45" rx="8" fill="#f8d9cf"/><text x="432" y="233" class="label">Wrong-path younger work is squashed</text><path d="M690,178 L690,197" stroke="#497084" stroke-width="2" fill="none" marker-end="url(#cpu-recovery-arrow)"/><path d="M690,253 L690,282 L110,282 L110,184" fill="none" stroke="#497084" stroke-width="2" marker-end="url(#cpu-recovery-arrow)"/><text x="300" y="309" class="small">Redirect and rebuild useful work; caches are not reset</text></svg>