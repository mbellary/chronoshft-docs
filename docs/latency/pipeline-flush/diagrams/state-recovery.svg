<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Recovery is a correctness protocol"><style>text{font-family:system-ui,sans-serif;fill:#163047}.label{font-size:18px;font-weight:650}.small{font-size:15px}.title{font-size:24px;font-weight:700}</style><defs><marker id="state-recovery-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#497084"/></marker></defs><rect width="1000" height="330" rx="16" fill="#f0f6f8"/><text x="30" y="38" class="title">Recovery is a correctness protocol</text><text x="30" y="65" class="small">Failure, overflow, or timeout keeps decisions disabled. Publication assumes a single owner.</text><rect x="30" y="115" width="265" height="85" rx="8" fill="#d9ece9"/><text x="162.5" y="145" text-anchor="middle" class="label">LIVE</text><text x="162.5" y="169" text-anchor="middle" class="small">decisions eligible</text><rect x="365" y="115" width="265" height="85" rx="8" fill="#f8d9cf"/><text x="497.5" y="145" text-anchor="middle" class="label">RECOVERING</text><text x="497.5" y="169" text-anchor="middle" class="small">decisions disabled</text><rect x="700" y="115" width="265" height="85" rx="8" fill="#dce7f6"/><text x="832.5" y="145" text-anchor="middle" class="label">BUILD + REPLAY</text><text x="832.5" y="169" text-anchor="middle" class="small">shadow candidate</text><path d="M299,157 L355,157" stroke="#497084" stroke-width="2" fill="none" marker-end="url(#state-recovery-arrow)"/><path d="M634,157 L690,157" stroke="#497084" stroke-width="2" fill="none" marker-end="url(#state-recovery-arrow)"/><text x="320" y="105" class="small">gap</text><text x="640" y="105" class="small">snapshot</text><path d="M830,205 L830,270 L160,270 L160,210" fill="none" stroke="#497084" stroke-width="2" marker-end="url(#state-recovery-arrow)"/><text x="350" y="297" class="label">Publish only after contiguous replay and validation</text></svg>