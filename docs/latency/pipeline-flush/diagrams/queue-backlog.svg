<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" role="img" aria-label="A short pause delays later arrivals"><style>text{font-family:system-ui,sans-serif;fill:#163047}.label{font-size:18px;font-weight:650}.small{font-size:15px}.title{font-size:24px;font-weight:700}</style><defs><marker id="queue-backlog-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#497084"/></marker></defs><rect width="1000" height="345" rx="16" fill="#f0f6f8"/><text x="30" y="38" class="title">A short pause delays later arrivals</text><text x="30" y="65" class="small">Qualitative diagram; not a measured latency trace.</text><text x="40" y="115" class="label">Work arrives</text><rect x="230" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="270" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="310" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="350" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="390" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="430" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="470" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="510" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="550" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="590" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="630" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="670" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="710" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="750" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="790" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="830" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="870" y="95" width="22" height="30" rx="4" fill="#91c6be"/><rect x="910" y="95" width="22" height="30" rx="4" fill="#91c6be"/><text x="40" y="180" class="label">Consumer</text><rect x="230" y