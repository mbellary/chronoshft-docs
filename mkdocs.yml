site_name: Chronoshft HFT Learning Path
site_url: https://mbellary.github.io/chronoshft-docs/
repo_url: https://github.com/mbellary/chronoshft-docs
edit_uri: edit/main/docs/
site_description: A growing learning path for high-frequency trading and low-latency engineering.
theme:
  name: readthedocs
  navigation_depth: 4
plugins:
  - search
markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
    absolute_links: warn
not_in_nav: |
  **/*-lab/README.md
nav:
  - Home: index.md
  - Microstructure:
      - Overview: microstructure/index.md
  - Systems:
      - Overview: systems/index.md
      - General foundations:
          - Memory alignment and padding: systems/memory-alignment-padding/memory-alignment-padding.md
      - HFT system engineering:
          - Memory alignment for HFT: systems/hft/memory-alignment-hft.md
  - Hardware:
      - Overview: hardware/index.md
      - General foundations:
          - Memory hierarchy: hardware/memory-hierarchy/memory-hierarchy.md
          - Branch prediction: hardware/branch-prediction/branch-prediction-chapter.md
          - Memory hierarchy verification: hardware/memory-hierarchy/verification.md
      - HFT system engineering:
          - Memory hierarchy for HFT: hardware/hft/memory-hierarchy-for-hft.md
          - Memory hierarchy for HFT validation: hardware/hft/memory-hierarchy-validation.md
  - Latency:
      - Overview: latency/index.md
      - Prefetching: latency/prefetch/prefetching-hft-chapter.md
      - Pipeline flushes: latency/pipeline-flush/pipeline-flush-chapter.md
      - Prefetching validation: latency/prefetch/validation-notes.md
      - Pipeline flush verification: latency/pipeline-flush/verification.md
  - Networking:
      - Overview: networking/index.md
  - Backtesting:
      - Overview: backtesting/index.md
